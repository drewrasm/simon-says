name: check

on:
  pull_request:
  push:
    branches: [main]
    # Merging a deploy PR must not publish another image or open another PR.
    paths-ignore: [infra/k8s/kustomization.yaml]
  workflow_dispatch:

permissions:
  contents: read

# Keep the newest main run; superseded releases stop before their deploy merge.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: simon_says
          POSTGRES_USER: simon_says
          POSTGRES_PASSWORD: local-simon-says
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simon_says -d simon_says"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://simon_says:local-simon-says@127.0.0.1:5432/simon_says
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @simon-says/db migrate:deploy
      - run: pnpm db:generate
      - run: pnpm db:check
      - name: Track 3 Postgres integration tests
        run: |
          sh apps/web/src/server/bookmarks/test-integration.sh
          sh apps/web/src/server/search/test-integration.sh
          sh apps/web/src/server/recaps/test-integration.sh
      - run: pnpm check
      - name: Test deploy-tag diff guard offline
        run: |
          python3 scripts/test-deploy-diff.py
          python3 scripts/test-propose-deploy.py
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: simon_says
          POSTGRES_USER: simon_says
          POSTGRES_PASSWORD: local-simon-says
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simon_says -d simon_says"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://simon_says:local-simon-says@127.0.0.1:5432/simon_says
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Build image without publishing
        run: docker build --platform linux/amd64 -t simon-says:ci .
      - name: Run the migration Job command in the image
        run: |
          docker run --rm --network host -w /app/migrate -e DATABASE_URL simon-says:ci \
            node node_modules/prisma/build/index.js migrate deploy
      - name: Check container transport locally
        env:
          PROBE_TOKEN: local-checkpoint-0a-probe-token-12345
        run: |
          trap 'docker logs simon-says-ci; docker rm -f simon-says-ci' EXIT
          docker run -d --name simon-says-ci -p 127.0.0.1:8080:8080 \
            -e PROBE_TOKEN -e DATABASE_URL=postgresql://dummy:dummy@127.0.0.1:5432/dummy simon-says:ci
          for _attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          node scripts/probe.mjs
          docker stop --time 20 simon-says-ci
          test "$(docker inspect -f '{{.State.ExitCode}}' simon-says-ci)" = 0
      - name: Render manifests offline
        run: KUBECONFIG=/dev/null kubectl kustomize infra/k8s > /tmp/simon-says.yaml

  publish:
    needs: [check, container]
    if: >-
      github.repository == 'drewrasm/simon-says' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: publish-deploy-main
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Skip superseded releases
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow origin main
          fi
          head=$(git rev-parse origin/main)
          if [ "$head" != "$GITHUB_SHA" ]; then
            # Capture the diff separately so a Git failure cannot look like no changes.
            source_changes=$(git diff --name-only "$GITHUB_SHA" "$head" -- . ':!infra/k8s/kustomization.yaml')
            if [ -n "$source_changes" ]; then
              stale=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "deploy/$GITHUB_SHA" --base main --state open --json number --jq '.[].number')
              if [ -n "$stale" ]; then
                gh pr close "$stale" --repo "$GITHUB_REPOSITORY"
              fi
              message="Main advanced with source changes; skipping the deploy PR for $GITHUB_SHA."
              echo "::warning::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            message="Main advanced only via kustomization; proposing $GITHUB_SHA on top of $head."
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.current.outputs.release == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish amd64 image
        if: steps.current.outputs.release == 'true'
        run: |
          image=ghcr.io/drewrasm/simon-says
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:$GITHUB_SHA" -t "$image:main" .
          docker push "$image:$GITHUB_SHA"
          docker push "$image:main"
      - name: Propose and merge immutable deploy tag through a guarded PR
        if: steps.current.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
        run: bash scripts/propose-deploy.sh
