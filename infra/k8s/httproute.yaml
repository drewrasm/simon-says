# Starter convention: inert in the vcluster, which has no Gateway.
# The host platform routes this hostname to Service app:80 independently.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: cnh
      namespace: gateway
      sectionName: https
  hostnames:
    - simon-says.cnh.radarhq.io
  rules:
    - backendRefs:
        - name: app
          port: 80
