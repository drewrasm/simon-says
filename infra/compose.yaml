name: simon-says

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: simon_says
      POSTGRES_USER: simon_says
      POSTGRES_PASSWORD: local-simon-says
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simon_says -d simon_says"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
