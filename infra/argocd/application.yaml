# FILE ONLY. Applying/enabling GitOps requires separate authorization.
# Unlike the starter, automatic sync/pruning/self-healing is intentionally absent.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-simon-says
spec:
  project: team-simon-says
  source:
    repoURL: https://github.com/drewrasm/simon-says.git
    targetRevision: main
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: team-simon-says
